.chart-wrap {

.top5-wrap {

  margin-bottom: 8px;

table.top5 {

}
table.top5 td {
  padding: 4px 6px;
  font-size: 12px;
  font-family: 'IBM Plex Mono', monospace;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
table.top5 tr:last-child td { border-bottom: none; }
table.top5 .stock-name { color: var(--text); }
table.top5 .stock-rev { color: var(--gold); text-align: right; }
table.top5 .stock-yoy {
  text-align: right;

table.top5 .yoy-pos { color: var(--red); }
table.top5 .yoy-neg { color: var(--green); }
table.top5 .yoy-na { color: var(--muted); }

.legend-row {

.legend-line { width: 16px; height: 2px; background: var(--line-color); }

.note {

  font-size: 10px;
  color: var(--muted);

const SECTOR_ORDER = [
  "semiconductor","computer_peripherals","optoelectronics",
  "electronic_components","electronic_distribution",
  "it_services","other_electronics"
];

Chart.defaults.color = "#8b949e";
Chart.defaults.borderColor = "rgba(255,255,255,0.06)";
Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.font.size = 10;

function formatRev(v) {
  if (v == null) return "—";
  if (v >= 10000) return (v / 10000).toFixed(1) + "兆";
  if (v >= 1000) return (v / 1000).toFixed(1) + "千億";
  return v.toFixed(0) + "億";
}

function yoyClass(v) {
  if (v == null) return "yoy-na";
  return v >= 0 ? "yoy-pos" : "yoy-neg";
}

function yoyText(v) {
  if (v == null) return "—";
  return (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
}

function buildChart(canvasId, sec) {
  const months = sec.months || [];
  const totalRev = sec.total_rev || [];
  const yoy = sec.yoy || [];

  const ctx = document.getElementById(canvasId).getContext("2d");

  // 抽稀 x 軸 label（每12個月顯示一次年份）
  const labels = months.map((m, i) => {
    if (m.endsWith("-01")) return m.slice(0, 4);
    return "";
  });

  return new Chart(ctx, {
    data: {
      labels: labels,
      datasets: [
        {
          type: "bar",
          label: "月營收(億)",
          data: totalRev,
          backgroundColor: "rgba(227,179,65,0.65)",
          hoverBackgroundColor: "rgba(227,179,65,0.9)",
          borderWidth: 0,
          yAxisID: "yRev",
          order: 2,
        },
        {
          type: "line",
          label: "YoY%",
          data: yoy,
          borderColor: "#f85149",
          borderWidth: 1.5,
          pointRadius: 0,
          pointHoverRadius: 3,
          fill: false,
          tension: 0.2,
          yAxisID: "yYoy",
          order: 1,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#161b22",
          borderColor: "#30363d",
          borderWidth: 1,
          padding: 10,
          callbacks: {
            title: (items) => months[items[0].dataIndex] || "",
            label: (item) => {
              if (item.datasetIndex === 0) {
                const v = item.raw;
                return ` 月營收: ${formatRev(v)}`;
              }
              const v = item.raw;
              if (v == null) return " YoY: —";
              return ` YoY: ${v >= 0 ? "+" : ""}${v.toFixed(1)}%`;
            },
          },
        },
      },
      scales: {
        x: {
          grid: { color: "rgba(255,255,255,0.04)", drawTicks: false },
          ticks: {
            maxRotation: 0,
            autoSkip: false,
          },
          border: { color: "rgba(255,255,255,0.1)" },
        },
        yRev: {
          type: "linear",
          position: "left",
          grid: { color: "rgba(255,255,255,0.06)" },
          ticks: {
            callback: (v) => formatRev(v),
            maxTicksLimit: 5,
          },
          border: { color: "transparent" },
        },
        yYoy: {
          type: "linear",
          position: "right",
          grid: { drawOnChartArea: false },
          ticks: {
            callback: (v) => (v >= 0 ? "+" : "") + v + "%",
            maxTicksLimit: 5,
            color: "#f85149",
          },
          border: { color: "transparent" },
        },
      },
    },
  });
}

function buildTop5(sec) {
  const top5 = sec.top5 || [];
  if (!top5.length) return '<div style="color:var(--muted);font-size:11px">無資料</div>';
  const rows = top5.map(s => `
    <tr>
      <td class="stock-name">${s.id}<br><span style="color:var(--muted)">${s.name}</span></td>
      <td class="stock-rev">${formatRev(s.rev)}</td>
      <td class="stock-yoy ${yoyClass(s.yoy)}">${yoyText(s.yoy)}</td>
    </tr>
  `).join("");
  return `<table class="top5"><tbody>${rows}</tbody></table>`;
}

const chartInstances = {};

function updateChartData(canvasId, sec) {
  const chart = chartInstances[canvasId];
  if (!chart) return;
  const months = sec.months || [];
  const labels = months.map(m => m.endsWith('-01') ? m.slice(0, 4) : '');
  chart.data.labels = labels;
  chart.data.datasets[0].data = sec.total_rev || [];
  chart.data.datasets[1].data = sec.yoy || [];
  chart.update('none');
}

function updateTop5(card, sec) {
  const wrap = card.querySelector('.top5-wrap');
  if (!wrap) return;
  const monthNum = sec.last_month ? parseInt(sec.last_month.split('-')[1], 10) : null;
  const label = monthNum ? `${monthNum}月 Top 5 營收` : 'Top 5 營收';
  wrap.innerHTML = `<div class="top5-label">${label}</div>${buildTop5(sec)}`;
}

function render() {
  const data = REVENUE_DATA;
  const sectors = data.sectors || {};

  document.getElementById("updated-label").textContent =
    data.updated ? `資料更新：${data.updated}` : "";

  const container = document.getElementById("main-container");
  container.innerHTML = "";

  SECTOR_ORDER.forEach((key, idx) => {
    const sec = sectors[key];
    if (!sec) return;

    const canvasId = `chart-${key}`;
    const card = document.createElement("div");
    card.className = "sector-card";

    const lastMonthLabel = sec.last_month
      ? `最新月份：${sec.last_month}`
      : "";
    const top5MonthLabel = sec.last_month
      ? `${parseInt(sec.last_month.split('-')[1], 10)}月 Top 5 營收`
      : 'Top 5 營收';

    const lastRev = sec.total_rev && sec.total_rev.length
      ? sec.total_rev[sec.total_rev.length - 1]
      : null;
    const lastYoy = sec.yoy && sec.yoy.length
      ? sec.yoy[sec.yoy.length - 1]
      : null;

    const revLabel = lastRev != null
      ? `${formatRev(lastRev)} &nbsp;<span style="color:${lastYoy != null && lastYoy >= 0 ? '#f85149' : '#3fb950'};font-size:11px">${yoyText(lastYoy)} YoY</span>`
      : "";

    const hasSub = sec.subsectors && Object.keys(sec.subsectors).length > 0;
    const tabsHtml = hasSub ? `
      <div class="tabs-row">
        <button class="tab-btn active" data-subkey="__all__">全部</button>
        ${Object.entries(sec.subsectors).map(([sk, sub]) =>
          `<button class="tab-btn" data-subkey="${sk}">${sub.name}</button>`
        ).join('')}
      </div>` : '';

    card.innerHTML = `
      <div class="sector-header">
        <span class="sector-title">${sec.name}</span>
        <span class="sector-last-month">${lastMonthLabel}</span>
        <span style="margin-left:auto;font-size:12px;font-family:monospace">${revLabel}</span>
      </div>
      <div class="sector-body">
        <div>
          ${tabsHtml}
          <div class="legend-row">
            <span class="legend-item"><span class="legend-bar"></span>月營收合計（億元，左軸）</span>
            <span class="legend-item"><span class="legend-line"></span>年增率 YoY%（右軸）</span>
          </div>
          <div class="chart-wrap">
            <canvas id="${canvasId}"></canvas>
          </div>
        </div>
        <div class="top5-wrap">
          <div class="top5-label">${top5MonthLabel}</div>
          ${buildTop5(sec)}
        </div>
      </div>
      <div class="note">
        資料來源：FinMind TaiwanStockMonthRevenue｜包含主要上市公司，非產業完整加總
      </div>
    `;

    container.appendChild(card);

    requestAnimationFrame(() => {
      chartInstances[canvasId] = buildChart(canvasId, sec);
    });

    if (hasSub) {
      card.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          card.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const subKey = btn.dataset.subkey;
          const displaySec = subKey === '__all__' ? sec : sec.subsectors[subKey];
          updateChartData(canvasId, displaySec);
          updateTop5(card, displaySec);
        });
      });
    }
  });
}

render();
</script>
